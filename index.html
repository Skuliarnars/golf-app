<!DOCTYPE html>
<html lang="is">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Golfkennsla">
<title>Golfkennsla</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body { font-family: system-ui, -apple-system, sans-serif; margin: 0; background: #f4f6f4; color: #1d2a1f; }
  header { background: #1f5c35; color: #fff; padding: 14px 16px; padding-top: calc(14px + env(safe-area-inset-top, 0px));
           display: flex; justify-content: space-between; align-items: center; gap: 8px; position: sticky; top: 0; z-index: 5; }
  header h1 { font-size: 18px; margin: 0; font-weight: 600; flex: 1; }
  main { padding: 16px; padding-bottom: 90px; max-width: 640px; margin: 0 auto; }
  .card { background: #fff; border-radius: 12px; padding: 14px; margin-bottom: 12px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  button { background: #1f5c35; color: #fff; border: 0; border-radius: 8px; padding: 10px 14px; font-size: 15px; cursor: pointer; }
  button.secondary { background: #e6ece7; color: #1d2a1f; }
  button.ghost { background: transparent; color: #fff; padding: 6px 8px; }
  button.danger { background: #b00020; color: #fff; padding: 6px 10px; }
  input, select, textarea { width: 100%; padding: 10px; font-size: 16px; border: 1px solid #c9d3cb; border-radius: 8px; margin: 4px 0 10px; font-family: inherit; background: #fff; }
  label { font-size: 14px; color: #4a5a4e; }
  .row { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 10px 0; border-bottom: 1px solid #eef1ee; }
  .row:last-child { border-bottom: 0; }
  .muted { color: #6b776e; font-size: 14px; }
  .badge { background: #fde9c8; color: #7a4a00; border-radius: 999px; padding: 2px 8px; font-size: 12px; white-space: nowrap; }
  .badge.ok { background: #d6f0de; color: #1f5c35; }
  h2 { font-size: 17px; margin: 4px 0 10px; }
  .hidden { display: none !important; }
  .status { min-height: 20px; font-size: 14px; margin: 8px 0; color: #1f5c35; }
  .status.err { color: #b00020; }
  .center { text-align: center; padding-top: 60px; }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .actions button { flex: 1; }
  .dash-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }
  .big { font-size: 20px; font-weight: 600; margin: 2px 0 8px; }
  .big.danger { color: #b00020; }
  .big.success { color: #1f5c35; }
  .fab { position: fixed; right: 16px; bottom: calc(84px + env(safe-area-inset-bottom, 0px)); width: 56px; height: 56px;
         border-radius: 50%; font-size: 30px; line-height: 1; padding: 0; display: flex; align-items: center; justify-content: center;
         box-shadow: 0 2px 8px rgba(0,0,0,.25); z-index: 6; }
  .tabbar { position: fixed; left: 0; right: 0; bottom: 0; display: grid; grid-template-columns: repeat(5, 1fr); background: #fff;
            border-top: 1px solid #dde3de; padding-bottom: env(safe-area-inset-bottom, 0px); z-index: 5; }
  .tabbar button { background: transparent; color: #6b776e; border-radius: 0; padding: 10px 2px; font-size: 12px; }
  .tabbar button.active { color: #1f5c35; font-weight: 600; }
</style>
</head>
<body>

<header>
  <button id="backBtn" class="ghost hidden" aria-label="Til baka">←</button>
  <h1 id="title">Golfkennsla</h1>
  <button id="logoutBtn" class="ghost hidden">Út</button>
</header>

<main>
  <!-- Innskráning -->
  <div id="loginView" class="center">
    <h2>Golfkennsla</h2>
    <p class="muted">Skráðu þig inn með Google til að halda áfram.</p>
    <button id="loginBtn">Skrá inn með Google</button>
  </div>

  <div id="appView" class="hidden">

    <!-- Yfirlit -->
    <div id="dashView" class="hidden">
      <div class="dash-grid">
        <div class="card">
          <div class="muted">Greiðslur</div>
          <div class="muted" style="margin-top:6px">Ógreitt</div>
          <div id="dashUnpaid" class="big danger">0 kr.</div>
          <div class="muted">Greitt í mánuðinum</div>
          <div id="dashPaid" class="big success">0 kr.</div>
        </div>
        <div class="card">
          <div class="muted">Næstu 7 dagar</div>
          <div id="dashCount" class="big">0</div>
          <div class="muted">tímar bókaðir</div>
        </div>
      </div>
      <div class="card">
        <h2>Tímar framundan</h2>
        <div id="upcomingList"></div>
      </div>
    </div>

    <!-- Nemendur -->
    <div id="listView" class="hidden">
      <div class="card">
        <h2>Nemendur</h2>
        <div id="studentList"></div>
      </div>
    </div>

    <!-- Tímar -->
    <div id="lessonsView" class="hidden">
      <div class="card">
        <h2>Allir tímar</h2>
        <div id="allLessonsList"></div>
      </div>
    </div>

    <!-- Greiðslur -->
    <div id="paymentsView" class="hidden">
      <div class="card">
        <div class="muted">Samtals greitt</div>
        <div id="paymentsTotal" class="big success">0 kr.</div>
      </div>
      <div class="card">
        <h2>Allar greiðslur</h2>
        <div id="allPaymentsList"></div>
      </div>
    </div>

    <!-- Stillingar -->
    <div id="settingsView" class="hidden">
      <div class="card">
        <h2>Stillingar</h2>
        <label>Verð á tíma (kr.)</label>
        <input id="priceInput" type="number" min="0" step="500">
        <button id="savePriceBtn">Vista verð</button>
      </div>
    </div>

    <!-- Upplýsingar um nemanda -->
    <div id="detailView" class="hidden">
      <div class="card">
        <h2 id="detailTitle"></h2>
        <div id="studentInfo"></div>
        <button id="deleteStudentBtn" class="danger" style="margin-top:10px">Eyða nemanda</button>
      </div>

      <div class="card">
        <h2>Bóka tíma</h2>
        <label>Dagsetning</label><input id="lDate" type="date">
        <label>Upphafstími</label><input id="lTime" type="time" value="10:00">
        <label>Lengd (mínútur)</label><input id="lMins" type="number" value="60" min="15" step="15">
        <label>Staðsetning</label>
        <select id="lLocation">
          <option value="GKG">GKG</option>
          <option value="Kórinn">Kórinn</option>
          <option value="Annað">Annað</option>
        </select>
        <input id="lLocationOther" class="hidden" placeholder="Skrifaðu staðsetninguna">
        <label>Athugasemdir</label><input id="lNotes">
        <button id="bookBtn">Bóka og setja í dagatal</button>
      </div>

      <div class="card">
        <h2>Tímar</h2>
        <div id="lessonList"></div>
      </div>

      <div class="card">
        <h2>Greiðslur</h2>
        <div id="paymentList"></div>
        <hr style="border:0;border-top:1px solid #eef1ee;margin:12px 0">
        <h2>Skrá greiðslu</h2>
        <label>Upphæð (kr.)</label><input id="pAmount" type="number" min="0" step="500">
        <label>Dagsetning</label><input id="pDate" type="date">
        <label>Athugasemd</label><input id="pNotes">
        <button id="addPaymentBtn">Vista greiðslu</button>
      </div>
    </div>

    <!-- Nýr nemandi -->
    <div id="addView" class="hidden">
      <div class="card">
        <h2>Nýr nemandi</h2>
        <label>Nafn</label><input id="sName" autocomplete="off">
        <label>Símanúmer</label><input id="sPhone" type="tel">
        <label>Netfang</label><input id="sEmail" type="email">
        <label>Markmið</label><input id="sGoal">
        <label>Athugasemdir</label><textarea id="sNotes" rows="2"></textarea>
        <button id="addStudentBtn">Vista nemanda</button>
      </div>
    </div>

    <!-- Athugasemd við tíma -->
    <div id="lessonEditView" class="hidden">
      <div class="card">
        <h2 id="leTitle"></h2>
        <div id="leInfo" class="muted" style="margin-bottom:12px"></div>
        <label>Hvernig gekk tíminn?</label>
        <textarea id="leNotes" rows="6"></textarea>
        <button id="saveLessonNotesBtn">Vista athugasemd</button>
      </div>
    </div>

    <nav id="tabBar" class="tabbar hidden">
      <button id="tabDash">Yfirlit</button>
      <button id="tabStudents">Nemendur</button>
      <button id="tabLessons">Tímar</button>
      <button id="tabPayments">Greiðslur</button>
      <button id="tabSettings">Stillingar</button>
    </nav>
    <button id="addNewBtn" class="fab hidden" aria-label="Nýr nemandi">+</button>
    <div id="msg" class="status"></div>
  </div>
</main>

<script>
// ===== STILLINGAR: breyttu þessum þremur línum =====
const CLIENT_ID = '1087644027595-27ct2jcfp9h7iphlsp017rf3lsm82m3p.apps.googleusercontent.com';
const SHEET_ID = '1pY3x9z16uoMqH2lu-bc-VWRoCil77j3PpYuVFnCpYpw';
const ALLOWED_EMAIL = 'skuliarnars12@gmail.com';
// ====================================================

const SCOPES = 'openid email https://www.googleapis.com/auth/spreadsheets https://www.googleapis.com/auth/calendar.events';
const TZ = 'Atlantic/Reykjavik';
const STATUSES = ['Bokaður', 'Mættur', 'Aflýst'];
const VIEWS = ['dashView', 'listView', 'lessonsView', 'paymentsView', 'settingsView', 'detailView', 'addView', 'lessonEditView'];
let backTarget = () => goTab('students');
let editingLessonRow = null;
const TABS = {
  dash:     { view: 'dashView',     title: 'Yfirlit',   tab: 'tabDash' },
  students: { view: 'listView',     title: 'Nemendur',  tab: 'tabStudents' },
  lessons:  { view: 'lessonsView',  title: 'Tímar',     tab: 'tabLessons' },
  payments: { view: 'paymentsView', title: 'Greiðslur', tab: 'tabPayments' },
  settings: { view: 'settingsView', title: 'Stillingar', tab: 'tabSettings' }
};

let LESSON_PRICE = 8000; // sótt úr flipanum Stillingar í töflunni
let tokenClient = null;
let accessToken = null;
let students = [], lessons = [], payments = [];
let currentStudent = null;

const $ = id => document.getElementById(id);

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
}
function msg(text, isErr = false) {
  const m = $('msg');
  m.textContent = text;
  m.className = 'status' + (isErr ? ' err' : '');
}
function todayISO() {
  const d = new Date();
  return new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
}
function addDaysISO(iso, n) {
  const d = new Date(iso + 'T00:00:00');
  d.setDate(d.getDate() + n);
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${d.getFullYear()}-${m}-${day}`;
}

// ----- Innskráning -----
window.addEventListener('load', () => {
  if (!window.google || !google.accounts) {
    msg('Google innskráning hleðst ekki. Athugaðu nettenginguna.', true);
    return;
  }
  tokenClient = google.accounts.oauth2.initTokenClient({
    client_id: CLIENT_ID,
    scope: SCOPES,
    callback: onToken
  });
});

$('loginBtn').onclick = () => {
  if (!tokenClient) { msg('Innskráning er ekki tilbúin, reyndu aftur.', true); return; }
  tokenClient.requestAccessToken({ hint: ALLOWED_EMAIL });
};

async function onToken(resp) {
  if (resp.error) { msg('Innskráning mistókst: ' + resp.error, true); return; }
  accessToken = resp.access_token;
  try {
    const info = await api('https://www.googleapis.com/oauth2/v3/userinfo');
    if (info.email !== ALLOWED_EMAIL) {
      google.accounts.oauth2.revoke(accessToken, () => {});
      accessToken = null;
      msg('Þessi aðgangur hefur ekki heimild til að nota appið.', true);
      return;
    }
    $('loginView').classList.add('hidden');
    $('appView').classList.remove('hidden');
    $('logoutBtn').classList.remove('hidden');
    $('lDate').value = todayISO();
    $('pDate').value = todayISO();
    goTab('dash');
    await loadAll();
  } catch (e) {
    msg('Villa: ' + e.message, true);
  }
}

$('logoutBtn').onclick = () => {
  if (accessToken) google.accounts.oauth2.revoke(accessToken, () => {});
  accessToken = null;
  location.reload();
};

// ----- API hjálparföll -----
async function api(url, opts = {}) {
  const res = await fetch(url, {
    ...opts,
    headers: {
      'Authorization': 'Bearer ' + accessToken,
      'Content-Type': 'application/json',
      ...(opts.headers || {})
    }
  });
  if (!res.ok) {
    const t = await res.text();
    throw new Error(res.status + ' ' + t.slice(0, 200));
  }
  return res.json();
}

const sheetUrl = range => `https://sheets.googleapis.com/v4/spreadsheets/${SHEET_ID}/values/${encodeURIComponent(range)}`;

async function getRows(range) {
  const d = await api(sheetUrl(range));
  return d.values || [];
}
async function appendRow(range, row) {
  return api(sheetUrl(range) + ':append?valueInputOption=USER_ENTERED', {
    method: 'POST',
    body: JSON.stringify({ values: [row] })
  });
}
async function setCell(range, value) {
  return api(sheetUrl(range) + '?valueInputOption=USER_ENTERED', {
    method: 'PUT',
    body: JSON.stringify({ values: [[value]] })
  });
}
// Eyðir línum. sheetId: 0=Nemendur, 1=Tímar, 2=Greiðslur. Röð: raðað niður á við svo línunúmer haldist rétt.
async function deleteRows(items) {
  const requests = [...items]
    .sort((a, b) => a.sheetId - b.sheetId || b.row - a.row)
    .map(i => ({ deleteDimension: { range: { sheetId: i.sheetId, dimension: 'ROWS', startIndex: i.row - 1, endIndex: i.row } } }));
  if (!requests.length) return;
  await api(`https://sheets.googleapis.com/v4/spreadsheets/${SHEET_ID}:batchUpdate`, {
    method: 'POST',
    body: JSON.stringify({ requests })
  });
}
// Eyðir viðburði í dagatalinu og sendir afbókun til nemanda. Skilar true ef tókst (eða viðburður var ekki til).
async function deleteCalendarEvent(id) {
  if (!id) return true;
  const res = await fetch(`https://www.googleapis.com/calendar/v3/calendars/primary/events/${encodeURIComponent(id)}?sendUpdates=all`, {
    method: 'DELETE',
    headers: { 'Authorization': 'Bearer ' + accessToken }
  });
  return res.ok || res.status === 404 || res.status === 410;
}

// ----- Gögn -----
async function loadAll() {
  msg('Hleð gögnum...');
  const [n, t, g, s] = await Promise.all([
    getRows("'Nemendur'!A2:F"),
    getRows("'Tímar'!A2:I"),
    getRows("'Greiðslur'!A2:E"),
    getRows("'Stillingar'!B1")
  ]);
  students = n.map((r, i) => ({ row: i + 2, name: r[0] || '', phone: r[1] || '', email: r[2] || '', goal: r[3] || '', notes: r[4] || '' }))
              .filter(x => x.name);
  lessons = t.map((r, i) => ({ row: i + 2, name: r[0] || '', date: r[1] || '', time: r[2] || '', mins: r[3] || '',
                               status: r[4] || '', paid: r[5] || 'nei', notes: r[6] || '', eventId: r[7] || '', location: r[8] || '' }))
             .filter(l => l.name);
  payments = g.map((r, i) => ({ row: i + 2, name: r[0] || '', date: r[1] || '', amount: r[2] || '', notes: r[4] || '' }))
              .filter(p => p.name);
  if (s[0] && Number(s[0][0]) > 0) LESSON_PRICE = Number(s[0][0]);
  $('priceInput').value = LESSON_PRICE;
  if (currentStudent) currentStudent = students.find(x => x.name === currentStudent.name) || null;
  msg('');
  renderAll();
}

function renderAll() {
  renderDash();
  renderList();
  renderLessons();
  renderPayments();
  if (currentStudent) renderDetail();
}

// ----- Leiðsögn -----
function goTab(name) {
  currentStudent = null;
  const cfg = TABS[name];
  VIEWS.forEach(v => $(v).classList.toggle('hidden', v !== cfg.view));
  Object.values(TABS).forEach(c => $(c.tab).classList.toggle('active', c === cfg));
  $('tabBar').classList.remove('hidden');
  $('backBtn').classList.add('hidden');
  $('addNewBtn').classList.toggle('hidden', name !== 'students');
  $('title').textContent = cfg.title;
  renderAll();
}
function showDetail(name) {
  const s = students.find(x => x.name === name);
  if (!s) return;
  currentStudent = s;
  backTarget = () => goTab('students');
  VIEWS.forEach(v => $(v).classList.toggle('hidden', v !== 'detailView'));
  $('tabBar').classList.add('hidden');
  $('addNewBtn').classList.add('hidden');
  $('backBtn').classList.remove('hidden');
  $('title').textContent = s.name;
  renderDetail();
  window.scrollTo(0, 0);
}
function showAdd() {
  currentStudent = null;
  VIEWS.forEach(v => $(v).classList.toggle('hidden', v !== 'addView'));
  $('tabBar').classList.add('hidden');
  $('addNewBtn').classList.add('hidden');
  $('backBtn').classList.remove('hidden');
  $('title').textContent = 'Nýr nemandi';
  msg('');
}
$('backBtn').onclick = () => backTarget();
$('tabDash').onclick = () => goTab('dash');
$('tabStudents').onclick = () => goTab('students');
$('tabLessons').onclick = () => goTab('lessons');
$('tabPayments').onclick = () => goTab('payments');
$('tabSettings').onclick = () => goTab('settings');
$('addNewBtn').onclick = showAdd;

// ----- Athugasemdir við tíma -----
function showLessonEdit(row) {
  const l = lessons.find(x => x.row === row);
  if (!l) return;
  editingLessonRow = row;
  const fromName = currentStudent ? currentStudent.name : null;
  backTarget = fromName ? () => showDetail(fromName) : () => goTab('lessons');
  VIEWS.forEach(v => $(v).classList.toggle('hidden', v !== 'lessonEditView'));
  $('tabBar').classList.add('hidden');
  $('addNewBtn').classList.add('hidden');
  $('backBtn').classList.remove('hidden');
  $('title').textContent = 'Tími';
  $('leTitle').textContent = l.name;
  $('leInfo').textContent = `${l.date} kl. ${l.time} · ${l.mins} mín${l.location ? ' · ' + l.location : ''} · ${l.status}`;
  $('leNotes').value = l.notes;
  msg('');
}
async function saveLessonNotes() {
  const l = lessons.find(x => x.row === editingLessonRow);
  if (!l) return;
  try {
    msg('Vista athugasemd...');
    await setCell(`'Tímar'!G${l.row}`, $('leNotes').value.trim());
    await loadAll();
    backTarget();
    msg('Athugasemd vistuð.');
  } catch (e) { msg(e.message, true); }
}
$('saveLessonNotesBtn').onclick = saveLessonNotes;

// ----- Yfirlit -----
function renderDash() {
  const today = todayISO();
  const weekEnd = addDaysISO(today, 7);
  const active = lessons.filter(l => l.status !== 'Aflýst');
  const upcoming = active.filter(l => l.date >= today)
    .sort((a, b) => (a.date + a.time).localeCompare(b.date + b.time));
  const next7 = upcoming.filter(l => l.date <= weekEnd).length;
  const unpaidCount = active.filter(l => l.paid.toLowerCase() !== 'já').length;
  const monthPrefix = today.slice(0, 7);
  const paidMonth = payments
    .filter(p => String(p.date).startsWith(monthPrefix))
    .reduce((sum, p) => sum + Number(p.amount || 0), 0);

  $('dashUnpaid').textContent = (unpaidCount * LESSON_PRICE).toLocaleString('is-IS') + ' kr.';
  $('dashPaid').textContent = paidMonth.toLocaleString('is-IS') + ' kr.';
  $('dashCount').textContent = next7;

  const el = $('upcomingList');
  el.innerHTML = '';
  if (!upcoming.length) { el.innerHTML = '<p class="muted">Engir tímar framundan.</p>'; return; }
  upcoming.slice(0, 10).forEach(l => {
    const paid = l.paid.toLowerCase() === 'já';
    const div = document.createElement('div');
    div.className = 'row';
    div.style.cursor = 'pointer';
    div.innerHTML = `<div><strong>${esc(l.name)}</strong>
      <div class="muted">${esc(l.date)} kl. ${esc(l.time)}${l.location ? ' · ' + esc(l.location) : ''}</div></div>
      <span class="badge ${paid ? 'ok' : ''}">${paid ? 'Greitt' : 'Ógreitt'}</span>`;
    div.onclick = () => showDetail(l.name);
    el.appendChild(div);
  });
}

// ----- Nemendur -----
function renderList() {
  const el = $('studentList');
  el.innerHTML = '';
  if (!students.length) { el.innerHTML = '<p class="muted">Engir nemendur enn.</p>'; return; }
  students.forEach(s => {
    const unpaid = lessons.filter(l => l.name === s.name && l.paid.toLowerCase() !== 'já').length;
    const div = document.createElement('div');
    div.className = 'row';
    div.style.cursor = 'pointer';
    div.innerHTML = `<div><strong>${esc(s.name)}</strong><div class="muted">${esc(s.phone)}</div></div>` +
                    (unpaid ? `<span class="badge">${unpaid} ógreitt</span>` : '');
    div.onclick = () => showDetail(s.name);
    el.appendChild(div);
  });
}

function renderDetail() {
  const s = currentStudent;
  if (!s) return;
  $('detailTitle').textContent = s.name;
  $('studentInfo').innerHTML =
    `<div class="muted">${esc(s.phone)} ${s.email ? '· ' + esc(s.email) : ''}</div>` +
    (s.goal ? `<div>${esc(s.goal)}</div>` : '') +
    (s.notes ? `<div class="muted">${esc(s.notes)}</div>` : '');

  // Tímar
  const myLessons = lessons.filter(l => l.name === s.name)
    .sort((a, b) => (a.date + a.time).localeCompare(b.date + b.time));
  const lessonEl = $('lessonList');
  lessonEl.innerHTML = '';
  if (!myLessons.length) lessonEl.innerHTML = '<p class="muted">Engir tímar enn.</p>';
  myLessons.forEach(l => {
    const div = document.createElement('div');
    div.className = 'row';
    div.innerHTML = `<div>${esc(l.date)} kl. ${esc(l.time)} <span class="muted">(${esc(l.mins)} mín)</span>
                       <div class="muted">${esc(l.status)}${l.location ? ' · ' + esc(l.location) : ''}${l.notes ? ' · ' + esc(l.notes) : ''}</div></div>`;
    const actions = document.createElement('div');
    actions.className = 'actions';
    actions.style.flex = '0 0 auto';
    const statusBtn = document.createElement('button');
    statusBtn.className = 'secondary';
    statusBtn.textContent = 'Staða';
    statusBtn.onclick = () => changeStatus(l);
    const paidBtn = document.createElement('button');
    paidBtn.className = 'secondary';
    paidBtn.textContent = l.paid.toLowerCase() === 'já' ? 'Greitt ✓' : 'Ógreitt';
    paidBtn.onclick = () => togglePaid(l);
    const delBtn = document.createElement('button');
    delBtn.className = 'danger';
    delBtn.textContent = '✕';
    delBtn.onclick = () => deleteLesson(l);
    actions.append(statusBtn, paidBtn, delBtn);
    div.appendChild(actions);
    const info = div.firstElementChild;
    info.style.cursor = 'pointer';
    info.onclick = () => showLessonEdit(l.row);
    lessonEl.appendChild(div);
  });

  // Greiðslur
  const myPayments = payments.filter(p => p.name === s.name);
  const payEl = $('paymentList');
  payEl.innerHTML = '';
  if (!myPayments.length) payEl.innerHTML = '<p class="muted">Engar greiðslur skráðar.</p>';
  myPayments.forEach(p => {
    const div = document.createElement('div');
    div.className = 'row';
    div.innerHTML = `<div>${esc(p.date)} <span class="muted">${p.notes ? '· ' + esc(p.notes) : ''}</span></div>
                     <strong>${esc(p.amount)} kr.</strong>`;
    const delP = document.createElement('button');
    delP.className = 'danger';
    delP.textContent = '✕';
    delP.style.marginLeft = '8px';
    delP.onclick = () => deletePayment(p);
    div.appendChild(delP);
    payEl.appendChild(div);
  });
}

// ----- Tímar (allir) -----
function renderLessons() {
  const el = $('allLessonsList');
  el.innerHTML = '';
  const today = todayISO();
  const future = lessons.filter(l => l.date >= today)
    .sort((a, b) => (a.date + a.time).localeCompare(b.date + b.time));
  const past = lessons.filter(l => l.date < today)
    .sort((a, b) => (b.date + b.time).localeCompare(a.date + a.time));
  const all = [...future, ...past];
  if (!all.length) { el.innerHTML = '<p class="muted">Engir tímar enn.</p>'; return; }
  all.forEach(l => {
    const paid = l.paid.toLowerCase() === 'já';
    const div = document.createElement('div');
    div.className = 'row';
    div.style.cursor = 'pointer';
    div.innerHTML = `<div><strong>${esc(l.name)}</strong>
      <div class="muted">${esc(l.date)} kl. ${esc(l.time)}${l.location ? ' · ' + esc(l.location) : ''} · ${esc(l.status)}</div></div>
      <span class="badge ${paid ? 'ok' : ''}">${paid ? 'Greitt' : 'Ógreitt'}</span>`;
    div.onclick = () => showLessonEdit(l.row);
    el.appendChild(div);
  });
}

// ----- Greiðslur (allar) -----
function renderPayments() {
  const total = payments.reduce((sum, p) => sum + Number(p.amount || 0), 0);
  $('paymentsTotal').textContent = total.toLocaleString('is-IS') + ' kr.';
  const el = $('allPaymentsList');
  el.innerHTML = '';
  if (!payments.length) { el.innerHTML = '<p class="muted">Engar greiðslur skráðar.</p>'; return; }
  [...payments].sort((a, b) => String(b.date).localeCompare(String(a.date))).forEach(p => {
    const div = document.createElement('div');
    div.className = 'row';
    div.style.cursor = 'pointer';
    div.innerHTML = `<div><strong>${esc(p.name)}</strong>
      <div class="muted">${esc(p.date)}${p.notes ? ' · ' + esc(p.notes) : ''}</div></div>
      <strong>${esc(p.amount)} kr.</strong>`;
    div.onclick = () => showDetail(p.name);
    el.appendChild(div);
  });
}

// ----- Aðgerðir: nemendur -----
async function addStudent() {
  const name = $('sName').value.trim();
  if (!name) { msg('Vantar nafn.', true); return; }
  if (students.some(s => s.name === name)) { msg('Nemandi með þessu nafni er þegar til.', true); return; }
  try {
    msg('Vista...');
    await appendRow("'Nemendur'!A:F", [name, $('sPhone').value.trim(), $('sEmail').value.trim(),
                                        $('sGoal').value.trim(), $('sNotes').value.trim(), '']);
    ['sName', 'sPhone', 'sEmail', 'sGoal', 'sNotes'].forEach(id => $(id).value = '');
    await loadAll();
    goTab('students');
    msg('Nemandi vistaður.');
  } catch (e) { msg(e.message, true); }
}
$('addStudentBtn').onclick = addStudent;

async function deleteStudent() {
  if (!currentStudent) return;
  const name = currentStudent.name;
  const myLessons = lessons.filter(l => l.name === name);
  const myPayments = payments.filter(p => p.name === name);
  if (!confirm(`Eyða nemandanum ${name}, ${myLessons.length} tímum og ${myPayments.length} greiðslum? Viðburðum í Google Calendar fyrir tímana verður líka eytt. Ekki hægt að afturkalla.`)) return;
  try {
    msg('Eyði nemanda...');
    let calFailed = 0;
    for (const l of myLessons) {
      if (!(await deleteCalendarEvent(l.eventId))) calFailed++;
    }
    await deleteRows([
      ...myLessons.map(l => ({ sheetId: 1, row: l.row })),
      ...myPayments.map(p => ({ sheetId: 2, row: p.row })),
      { sheetId: 0, row: currentStudent.row }
    ]);
    await loadAll();
    goTab('students');
    msg(calFailed
      ? `Nemanda eytt, en ${calFailed} viðburðum í dagatalinu þarf að eyða handvirkt.`
      : 'Nemanda eytt.', calFailed > 0);
  } catch (e) { msg(e.message, true); }
}
$('deleteStudentBtn').onclick = deleteStudent;

// ----- Aðgerðir: tímar -----
$('lLocation').onchange = () => {
  $('lLocationOther').classList.toggle('hidden', $('lLocation').value !== 'Annað');
};

async function bookLesson() {
  const date = $('lDate').value;
  const time = $('lTime').value;
  const mins = parseInt($('lMins').value || '60', 10);
  const notes = $('lNotes').value.trim();
  if (!date || !time) { msg('Veldu dagsetningu og tíma.', true); return; }
  let location = $('lLocation').value;
  if (location === 'Annað') {
    location = $('lLocationOther').value.trim();
    if (!location) { msg('Skrifaðu staðsetninguna.', true); return; }
  }
  if (!currentStudent) return;

  const [h, m] = time.split(':').map(Number);
  const endTotal = h * 60 + m + mins;
  const eh = String(Math.floor(endTotal / 60) % 24).padStart(2, '0');
  const em = String(endTotal % 60).padStart(2, '0');
  const startDT = `${date}T${time}:00`;
  const endDT = `${date}T${eh}:${em}:00`;
  const name = currentStudent.name;
  const studentEmail = (currentStudent.email || '').trim();

  try {
    msg('Bóka tíma...');
    const ev = await api(`https://www.googleapis.com/calendar/v3/calendars/primary/events?sendUpdates=${studentEmail ? 'all' : 'none'}`, {
      method: 'POST',
      body: JSON.stringify({
        summary: `${name} - golfkennsla`,
        location: location,
        description: [location, notes].filter(Boolean).join(' · '),
        start: { dateTime: startDT, timeZone: TZ },
        end: { dateTime: endDT, timeZone: TZ },
        attendees: studentEmail ? [{ email: studentEmail }] : []
      })
    });
    await appendRow("'Tímar'!A:I", [name, date, time, mins, 'Bokaður', 'nei', notes, ev.id, location]);
    $('lNotes').value = '';
    $('lLocationOther').value = '';
    await loadAll();
    msg('Tími bókaður og settur í dagatalið.');
  } catch (e) { msg(e.message, true); }
}
$('bookBtn').onclick = bookLesson;

async function changeStatus(l) {
  const next = STATUSES[(STATUSES.indexOf(l.status) + 1) % STATUSES.length];
  try {
    await setCell(`'Tímar'!E${l.row}`, next);
    l.status = next;
    renderAll();
    msg('Staða uppfærð.');
  } catch (e) { msg(e.message, true); }
}

async function togglePaid(l) {
  const next = l.paid.toLowerCase() === 'já' ? 'nei' : 'já';
  try {
    await setCell(`'Tímar'!F${l.row}`, next);
    l.paid = next;
    renderAll();
    msg('Vistað.');
  } catch (e) { msg(e.message, true); }
}

async function deleteLesson(l) {
  if (!confirm(`Eyða tíma ${l.date} kl. ${l.time} hjá ${l.name}?`)) return;
  try {
    msg('Eyði tíma...');
    const calOk = await deleteCalendarEvent(l.eventId);
    await deleteRows([{ sheetId: 1, row: l.row }]);
    await loadAll();
    msg(calOk ? 'Tíma eytt.' : 'Tíma eytt úr töflunni, en viðburðinn í dagatalinu þarf að eyða handvirkt.', !calOk);
  } catch (e) { msg(e.message, true); }
}

// ----- Aðgerðir: greiðslur -----
async function addPayment() {
  const amount = $('pAmount').value;
  const date = $('pDate').value || todayISO();
  const notes = $('pNotes').value.trim();
  if (!amount) { msg('Vantar upphæð.', true); return; }
  if (!currentStudent) return;
  try {
    msg('Vista greiðslu...');
    await appendRow("'Greiðslur'!A:E", [currentStudent.name, date, Number(amount), '', notes]);
    $('pAmount').value = '';
    $('pNotes').value = '';
    await loadAll();
    msg('Greiðsla vistuð.');
  } catch (e) { msg(e.message, true); }
}
$('addPaymentBtn').onclick = addPayment;

async function deletePayment(p) {
  if (!confirm(`Eyða greiðslu ${p.amount} kr. frá ${p.date}?`)) return;
  try {
    msg('Eyði greiðslu...');
    await deleteRows([{ sheetId: 2, row: p.row }]);
    await loadAll();
    msg('Greiðslu eytt.');
  } catch (e) { msg(e.message, true); }
}

// ----- Stillingar -----
$('savePriceBtn').onclick = async () => {
  const v = Number($('priceInput').value);
  if (!v || v <= 0) { msg('Settu inn gilt verð.', true); return; }
  try {
    msg('Vista verð...');
    await setCell("'Stillingar'!B1", v);
    LESSON_PRICE = v;
    renderAll();
    msg('Verð vistað í töflunni.');
  } catch (e) { msg(e.message, true); }
};
</script>
